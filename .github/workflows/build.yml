name: Build Desktop & Android App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build Windows EXE
        run: |
          mkdir win-app
          cp index.html win-app/
          cd win-app
          npm init -y
          npm install electron@28 electron-builder@24 --save-dev
          echo "const { app, BrowserWindow } = require('electron'); app.whenReady().then(() => { const win = new BrowserWindow({ width: 1280, height: 800, autoHideMenuBar: true }); win.loadFile('index.html'); });" > main.js
          node -e "const pkg = require('./package.json'); pkg.name = 'sobuj-pos'; pkg.version = '1.0.0'; pkg.description = 'Sobuj POS'; pkg.author = 'Rafi'; pkg.main = 'main.js'; pkg.build = { appId: 'com.sobuj.pos', productName: 'Sobuj-POS', win: { target: 'portable' } }; require('fs').writeFileSync('package.json', JSON.stringify(pkg, null, 2));"
          npx electron-builder --win
      - name: Upload Windows EXE
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          files: win-app/dist/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Build Android APK
        run: |
          mkdir android-app
          mkdir android-app/www
          cp index.html android-app/www/
          cd android-app
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "Sobuj POS" "com.sobuj.pos" --web-dir www
          npx cap add android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload Android APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          files: android-app/android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
